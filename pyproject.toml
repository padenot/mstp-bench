[project]
name = "mstp-bench"
version = "1.0.0"
description = "Reproduce measurements of audio processing overruns: Web Audio versus MediaStreamTrackProcessor/Generator."
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "selenium"]

[project.scripts]
repro = "repro.cli:main"

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repro"]
